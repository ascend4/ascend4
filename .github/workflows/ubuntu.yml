name: ASCEND4 ubuntu

on:
  workflow_dispatch:
  push:
    branches: [ $default-branch, python3, master, main ]
  pull_request:
    branches: [ $default-branch, python3, master, main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      CUNIT_VERSION: "2.3.0"
      CUNIT_RELEASE_BASENAME: "cunit-2.3-0"
      CONOPT_VERSION: "4.39.0"
      CONOPT_ZIP_URL: "https://d37drm4t2jghv5.cloudfront.net/conopt/4.39.0/conopt-4_39_0-linux-x86_64.zip"
      HIGHS_VERSION: v1.13.1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
 
    steps:
    - uses: actions/checkout@v4

    - name: Check what Ubuntu mirror is being used
      run: |
        sudo cat /etc/apt/sources.list

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install automake autoconf libtool build-essential gfortran flex bison scons swig doxygen tcl8.6 tcl8.6-dev tk8.6 tk8.6-dev tk-table graphviz libgraphviz-dev python3-dev libgtk-3-dev python3-gi python3-numpy liblapack-dev libblas-dev libsundials-dev coinor-libipopt-dev libmumps-seq-dev libpcre3-dev libnlopt-dev python3-packaging cmake curl unzip

    - name: Download and install CONOPT
      run: |
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT
        curl -fsSL --retry 3 -o "$tmpdir/conopt.zip" "$CONOPT_ZIP_URL"
        unzip -q "$tmpdir/conopt.zip" -d "$tmpdir"
        mkdir -p "$HOME/.local"
        cp -a "$tmpdir/conopt-linux-x86_64/." "$HOME/.local/"
        test -f "$HOME/.local/lib/libconopt.so"
        test -L "$HOME/.local/lib/libconopt.so"
        ls -l "$HOME/.local/lib/libconopt.so"

    - name: Build and install CUnit
      run: |
        CUNIT_TARBALL="${CUNIT_RELEASE_BASENAME}.tar.gz"
        CUNIT_URL="https://github.com/ascend4/cunit/releases/download/v${CUNIT_VERSION}/${CUNIT_TARBALL}"
        curl -L --retry 3 -o "$CUNIT_TARBALL" "$CUNIT_URL"
        tar -xzf "$CUNIT_TARBALL"
        cd "$CUNIT_RELEASE_BASENAME"
        ./bootstrap
        ./configure --prefix=$HOME/.local --enable-debug
        make -j"$(nproc)"
        make install

    - name: Cache HiGHS install
      id: highs_cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/highs
          ~/.local/include/highs
          ~/.local/include/interfaces/highs_c_api.h
          ~/.local/lib/libhighs*
          ~/.local/lib/pkgconfig/highs.pc
          ~/.local/lib64/libhighs*
          ~/.local/lib64/pkgconfig/highs.pc
        key: ${{ runner.os }}-${{ matrix.os }}-highs-${{ env.HIGHS_VERSION }}

    - name: Build and install HiGHS
      if: steps.highs_cache.outputs.cache-hit != 'true'
      run: |
        git clone --branch "$HIGHS_VERSION" --depth 1 https://github.com/ERGO-Code/HiGHS.git highs
        cd highs
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$HOME/.local \
          -DBUILD_SHARED_LIBS=ON
        cmake --build build -j
        cmake --install build

    - name: Build ASCEND
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
        scons GCOV=1 CUNIT_PREFIX=$HOME/.local MALLOC_DEBUG=1 ascend models solvers ascxx pygtk test a4

    - name: ASCEND CUnit tests
      run: |
        ./a4 cutest -r mallocdebug

    - name: FPROPS CUnit tests
      run: |
        ./a4 script models/johnpye/fprops/test/cutest

    - name: ASCEND C++/Python wrapper tests
      run: |    
        ./a4 script ascxx/testslvreq
        ./a4 script ascxx/testipopt

    - name: ASCEND FPROPS external function test
      run: |    
        ./a4 run models/johnpye/fprops/rankine_fprops.a4c -m stream_state_test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        report_type: coverage
        flags: ubuntu-cunit
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

