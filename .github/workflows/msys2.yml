name: ASCEND4 MSYS2

on:
  workflow_dispatch:
  push:
    branches: [ $default-branch, python3, master, main ]
  pull_request:
    branches: [ $default-branch, python3, master, main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "1"
      ASCEND_CI_HIGHS_SERIAL: "1"
      CUNIT_VERSION: "2.2.3"
      CUNIT_PKGREL: "6"

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      matrix:
        include:
#          - { sys: mingw64, env: x86_64}
#          - { sys: mingw32, env: i686}
          - { sys: ucrt64,  env: ucrt-x86_64}
#          - { sys: clang64, env: clang-x86_64}

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        cache: true
        install: >-
          git swig make flex bison
          autoconf automake libtool m4
          mingw-w64-${{matrix.env}}-toolchain
          mingw-w64-${{matrix.env}}-gsl
          mingw-w64-${{matrix.env}}-gcc
          mingw-w64-${{matrix.env}}-gcc-fortran
          mingw-w64-${{matrix.env}}-gtk2
          mingw-w64-${{matrix.env}}-binutils
          mingw-w64-${{matrix.env}}-gdb
          mingw-w64-${{matrix.env}}-pkg-config
          mingw-w64-${{matrix.env}}-highs
          mingw-w64-${{matrix.env}}-python
          mingw-w64-${{matrix.env}}-python-pip
          mingw-w64-${{matrix.env}}-python-wheel
          mingw-w64-${{matrix.env}}-python-matplotlib
          mingw-w64-${{matrix.env}}-scons
        pacboy: >-
          gcovr:p
      
    - name: Install IPOPT package
      run: |
        PKG_URL='https://stg.fprops.org/public.php/dav/files/X54WgtSsEbFoFKG/mingw-w64-ucrt-x86_64-ipopt-3.14.19-1-any.pkg.tar.zst'
        PKG_FILE="${PKG_URL##*/}"
        curl -L --retry 3 -o "$PKG_FILE" "$PKG_URL"
        pacman -U --noconfirm "$PKG_FILE"
        pacman -Q mingw-w64-ucrt-x86_64-ipopt

    - name: Install CUnit package
      run: |
        PKG_FILE="mingw-w64-${{ matrix.env }}-cunit-${CUNIT_VERSION}-${CUNIT_PKGREL}-any.pkg.tar.zst"
        PKG_URL="https://github.com/ascend4/cunit/releases/download/v${CUNIT_VERSION}/${PKG_FILE}"
        curl -L --retry 3 -o "$PKG_FILE" "$PKG_URL"
        pacman -U --noconfirm "$PKG_FILE"
        pacman -Q "mingw-w64-${{ matrix.env }}-cunit"

    - uses: actions/checkout@v4

    - name: Build ASCEND
      run: |
        CUNIT_PREFIX="${MSYSTEM_PREFIX:-/${{ matrix.sys }}}"
        scons GCOV=1 MALLOC_DEBUG=1 CUNIT_PREFIX="$CUNIT_PREFIX" ascend solvers models test a4

    - name: Test ASCEND
      run: |
        ./a4 cutest -r mallocdebug

    - name: Generate coverage report
      run: |
        gcovr -r . \
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
          --cobertura-pretty \
          --output coverage.xml \
          --exclude '(^|/)(test)(/|$)' \
          --print-summary

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        disable_search: true
        plugins: noop
        flags: msys2-cunit
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

