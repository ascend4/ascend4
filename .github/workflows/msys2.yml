# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ASCEND4 MSYS2

on:
  workflow_dispatch:
  push:
    branches: [ $default-branch, python3, master, main ]
  pull_request:
    branches: [ $default-branch, python3, master, main ]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      matrix:
        include:
#          - { sys: mingw64, env: x86_64}
#          - { sys: mingw32, env: i686}
          - { sys: ucrt64,  env: ucrt-x86_64}
#          - { sys: clang64, env: clang-x86_64}

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: false
        cache: true
        install: >-
          git swig subversion make flex bison
          autoconf automake libtool m4
          mingw-w64-${{matrix.env}}-toolchain
          mingw-w64-${{matrix.env}}-gsl
          mingw-w64-${{matrix.env}}-gcc
          mingw-w64-${{matrix.env}}-gcc-fortran
          mingw-w64-${{matrix.env}}-gtk2
          mingw-w64-${{matrix.env}}-binutils
          mingw-w64-${{matrix.env}}-gdb
          mingw-w64-${{matrix.env}}-pkg-config
          mingw-w64-${{matrix.env}}-highs
          mingw-w64-${{matrix.env}}-python
          mingw-w64-${{matrix.env}}-python-pip
          mingw-w64-${{matrix.env}}-python-wheel
          mingw-w64-${{matrix.env}}-python-matplotlib

    - name: Install Python dependencies
      run: |
        python3 -m pip install scons

    - name: Get CUnit SVN revision
      id: cunit_rev
      run: |
        REV=$(svn info https://svn.code.sf.net/p/cunit/code/branches/mingw64 | awk -F': ' '/^Revision:/{print $2}')
        echo "rev=$REV" >> "$GITHUB_OUTPUT"

    - name: Cache CUnit install
      id: cunit_cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local
        key: ${{ runner.os }}-msys2-cunit-r${{ steps.cunit_rev.outputs.rev }}
        restore-keys: |
          ${{ runner.os }}-msys2-cunit-

    - name: Cache status
      run: |
        echo "CUnit cache hit: ${{ steps.cunit_cache.outputs.cache-hit }}"

    - name: Build and install CUnit
      run: |
        if [ ! -f "$HOME/.local/lib/libcunit.a" ]; then
          svn co https://svn.code.sf.net/p/cunit/code/branches/mingw64 cunit
          cd cunit
          ./configure --prefix=$HOME/.local
          make -j8
          make install
        fi

    - uses: actions/checkout@v4

    - name: Build ASCEND
      run: |
        mkdir -p ~/.local
        MSYSTEM= scons GCOV=1 MALLOC_DEBUG=1 CUNIT_PREFIX=$HOME/.local ascend solvers models test a4

    - name: Verify GDB
      run: |
        which gdb
        gdb --version
        ls -l ./test/test*

    - name: Verify GDB (ASCEND env)
      run: |
        ./a4 env --shell bash -- -lc "which gdb"
        ./a4 env --shell bash -- -lc "gdb --version"

    - name: Test ASCEND (solver_ipopt + integrator_lsode, gdb batch)
      run: |
        ./a4 env --shell bash -- -lc "gdb -batch -return-child-result -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args ./test/test solver_ipopt integrator_lsode"

    - name: Test ASCEND (mallocdebug except solver_highs, gdb batch)
      run: |
        ./a4 env --shell bash -- -lc "gdb -batch -return-child-result -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args ./test/test -r mallocdebug -e solver_highs"

    - name: Test ASCEND (mallocdebug full, gdb batch)
      run: |
        ./a4 env --shell bash -- -lc "gdb -batch -return-child-result -ex 'set pagination off' -ex run -ex 'thread apply all bt full' --args ./test/test -r mallocdebug"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        report_type: coverage
        flags: msys2-cunit
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

