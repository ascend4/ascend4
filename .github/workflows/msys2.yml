# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ASCEND4 MSYS2

on:
  workflow_dispatch:
  push:
    branches: [ $default-branch, python3, master, main ]
  pull_request:
    branches: [ $default-branch, python3, master, main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: "1"
      ASCEND_CI_HIGHS_SERIAL: "1"

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      matrix:
        include:
#          - { sys: mingw64, env: x86_64}
#          - { sys: mingw32, env: i686}
          - { sys: ucrt64,  env: ucrt-x86_64}
#          - { sys: clang64, env: clang-x86_64}

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: false
        cache: true
        install: >-
          git swig subversion make flex bison
          autoconf automake libtool m4
          mingw-w64-${{matrix.env}}-toolchain
          mingw-w64-${{matrix.env}}-gsl
          mingw-w64-${{matrix.env}}-gcc
          mingw-w64-${{matrix.env}}-gcc-fortran
          mingw-w64-${{matrix.env}}-gtk2
          mingw-w64-${{matrix.env}}-binutils
          mingw-w64-${{matrix.env}}-gdb
          mingw-w64-${{matrix.env}}-pkg-config
          mingw-w64-${{matrix.env}}-highs
          mingw-w64-${{matrix.env}}-python
          mingw-w64-${{matrix.env}}-python-pip
          mingw-w64-${{matrix.env}}-python-wheel
          mingw-w64-${{matrix.env}}-python-matplotlib

    - name: Install Python dependencies
      run: |
        python3 -m pip install scons

    - name: Get CUnit SVN revision
      id: cunit_rev
      run: |
        REV=$(svn info https://svn.code.sf.net/p/cunit/code/branches/mingw64 | awk -F': ' '/^Revision:/{print $2}')
        echo "rev=$REV" >> "$GITHUB_OUTPUT"

    - name: Cache CUnit install
      id: cunit_cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/ascend4-msys2-cunit
        key: ${{ runner.os }}-ascend4-msys2-cunit-v2-r${{ steps.cunit_rev.outputs.rev }}
        restore-keys: |
          ${{ runner.os }}-ascend4-msys2-cunit-v2-

    - name: Cache status
      run: |
        echo "CUnit cache hit: ${{ steps.cunit_cache.outputs.cache-hit }}"

    - name: Build and install CUnit
      run: |
        CUNIT_PREFIX="$(cygpath -u "$RUNNER_TEMP")/ascend4-msys2-cunit"
        mkdir -p "$CUNIT_PREFIX"
        if [ ! -f "$CUNIT_PREFIX/include/CUnit/CUnit.h" ] || { [ ! -f "$CUNIT_PREFIX/lib/libcunit.a" ] && [ ! -f "$CUNIT_PREFIX/lib/libcunit.dll.a" ]; }; then
          rm -rf "$CUNIT_PREFIX"
          mkdir -p "$CUNIT_PREFIX"
          svn co https://svn.code.sf.net/p/cunit/code/branches/mingw64 cunit
          cd cunit
          ./configure --prefix="$CUNIT_PREFIX"
          make -j8
          make install
          test -f "$CUNIT_PREFIX/include/CUnit/CUnit.h"
          test -f "$CUNIT_PREFIX/lib/libcunit.a" || test -f "$CUNIT_PREFIX/lib/libcunit.dll.a"
        fi

    - uses: actions/checkout@v4

    - name: Build ASCEND
      run: |
        CUNIT_PREFIX="$(cygpath -u "$RUNNER_TEMP")/ascend4-msys2-cunit"
        mkdir -p "$CUNIT_PREFIX"
        scons GCOV=1 MALLOC_DEBUG=1 CUNIT_PREFIX="$CUNIT_PREFIX" ascend solvers models test a4

    - name: Test ASCEND (solver_ipopt + integrator_lsode)
      run: |
        ./a4 cutest solver_ipopt integrator_lsode

    - name: Test ASCEND (mallocdebug except solver_highs)
      run: |
        ./a4 cutest -r mallocdebug -e solver_highs

    - name: Test ASCEND (mallocdebug full)
      run: |
        ./a4 cutest -r mallocdebug

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        report_type: coverage
        flags: msys2-cunit
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

