name: ASCEND4 Rocky 8

on:
  workflow_dispatch:
  push:
    branches: [ $default-branch, python3, master, main ]
  pull_request:
    branches: [ $default-branch, python3, master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:8.10

    env:
      CUNIT_VERSION: "2.3.2"
      CUNIT_RELEASE_BASENAME: "cunit-2.3-2"
      SUNDIALS_VERSION: "7.6.0"
      HIGHS_VERSION: "v1.13.1"
      OMP_NUM_THREADS: "1"
      ASCEND_CI_HIGHS_SERIAL: "1"
      ASCEND_CI_USER: "ascendci"
      ASCEND_CI_HOME: "/home/ascendci"

    steps:
    - uses: actions/checkout@v4

    - name: Enable extra repositories and install dependencies
      run: |
        dnf -y update
        dnf -y install epel-release dnf-plugins-core
        dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true
        dnf -y install \
          gcc gcc-c++ gcc-gfortran \
          make flex bison swig \
          autoconf automake libtool m4 \
          git curl patch which diffutils findutils tar gzip xz \
          cmake3 pkgconf-pkg-config \
          python3 python3-devel python3-pip python3-packaging python3-numpy python3-pyyaml \
          tcl-devel tk-devel \
          graphviz graphviz-devel \
          blas-devel lapack-devel \
          pcre-devel zlib-devel xz-devel

    - name: Create unprivileged build user
      run: |
        useradd -m -d "$ASCEND_CI_HOME" "$ASCEND_CI_USER"
        chown -R "$ASCEND_CI_USER:$ASCEND_CI_USER" "$GITHUB_WORKSPACE"

    - name: Install SCons
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" bash -lc '
          python3 -m pip install --user scons
        '

    - name: Build and install CUnit
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" CUNIT_VERSION="$CUNIT_VERSION" CUNIT_RELEASE_BASENAME="$CUNIT_RELEASE_BASENAME" bash -lc '
          cd "$GITHUB_WORKSPACE"
          CUNIT_TARBALL="${CUNIT_RELEASE_BASENAME}.tar.gz"
          CUNIT_URL="https://github.com/ascend4/cunit/releases/download/v${CUNIT_VERSION}/${CUNIT_TARBALL}"
          curl -L --retry 3 -o "$CUNIT_TARBALL" "$CUNIT_URL"
          tar -xzf "$CUNIT_TARBALL"
          cd "$CUNIT_RELEASE_BASENAME"
          touch README
          ./bootstrap
          ./configure --prefix="$HOME/.local" --enable-debug
          make -j"$(nproc)"
          make install
        '

    - name: Build and install SUNDIALS
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" SUNDIALS_VERSION="$SUNDIALS_VERSION" bash -lc '
          cd "$GITHUB_WORKSPACE"
          SUNDIALS_TARBALL="sundials-${SUNDIALS_VERSION}.tar.gz"
          SUNDIALS_URL="https://github.com/LLNL/sundials/releases/download/v${SUNDIALS_VERSION}/${SUNDIALS_TARBALL}"
          curl -L --retry 3 -o "$SUNDIALS_TARBALL" "$SUNDIALS_URL"
          tar -xzf "$SUNDIALS_TARBALL"
          cmake3 -S "sundials-${SUNDIALS_VERSION}" -B sundials-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_ARKODE=OFF \
            -DBUILD_CVODE=OFF \
            -DBUILD_CVODES=OFF \
            -DBUILD_IDA=ON \
            -DBUILD_IDAS=OFF \
            -DBUILD_KINSOL=OFF \
            -DBUILD_TESTING=OFF \
            -DEXAMPLES_ENABLE_C=OFF \
            -DEXAMPLES_ENABLE_CXX=OFF \
            -DEXAMPLES_INSTALL=OFF
          cmake3 --build sundials-build -j"$(nproc)"
          cmake3 --install sundials-build
        '

    - name: Build and install HiGHS
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" HIGHS_VERSION="$HIGHS_VERSION" bash -lc '
          cd "$GITHUB_WORKSPACE"
          git clone --branch "$HIGHS_VERSION" --depth 1 https://github.com/ERGO-Code/HiGHS.git highs
          cmake3 -S highs -B highs/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DBUILD_SHARED_LIBS=ON
          cmake3 --build highs/build -j"$(nproc)"
          cmake3 --install highs/build
        '

    - name: Build ASCEND
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc '
          cd "$GITHUB_WORKSPACE"
          export PATH="$HOME/.local/bin:$PATH"
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$HOME/.local/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$HOME/.local/lib64:$HOME/.local/lib:${LD_LIBRARY_PATH:-}"
          scons GCOV=1 MALLOC_DEBUG=1 \
            CUNIT_PREFIX="$HOME/.local" \
            SUNDIALS_PREFIX="$HOME/.local" \
            HIGHS_PREFIX="$HOME/.local" \
            ascend models solvers ascxx test a4
        '

    - name: ASCEND CUnit tests
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc '
          cd "$GITHUB_WORKSPACE"
          ./a4 cutest -r mallocdebug
        '

    - name: FPROPS CUnit tests
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc '
          cd "$GITHUB_WORKSPACE"
          ./a4 script models/johnpye/fprops/test/cutest
        '

    - name: ASCEND FPROPS external function test
      run: |
        runuser -u "$ASCEND_CI_USER" -- env HOME="$ASCEND_CI_HOME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -lc '
          cd "$GITHUB_WORKSPACE"
          ./a4 run models/johnpye/fprops/rankine_fprops.a4c -m stream_state_test
        '
